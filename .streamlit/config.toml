# Charte graphique OR'CHESTRE (reprise des présentations du projet) :
# bleu électrique, bleu pervenche, vert menthe ; titres larges en capitales, texte en Raleway.

[theme]
base = "light"
primaryColor = "#2626F5"
backgroundColor = "#F8FCFB"
secondaryBackgroundColor = "#E4F8F0"
textColor = "#17175E"
linkColor = "#2626F5"
borderColor = "#C9D3FB"
baseRadius = "0.5rem"
font = "Raleway:https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400..800;1,400..800&display=swap, sans-serif"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap, sans-serif"
chartCategoricalColors = ["#2626F5", "#5B7BF9", "#3CCB94", "#8A5CF6", "#1B9AAA", "#F29E4C", "#0E0E8C", "#9DB2FF", "#178A63", "#C2569B"]

[theme.sidebar]
backgroundColor = "#2626F5"
secondaryBackgroundColor = "#3D3DF7"
textColor = "#FFFFFF"
borderColor = "#5B7BF9"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
enableXsrfProtection = true
